name: Build project

on:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POSITION_INDEPENDENT_CODE=On
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/qpOASES-install"
      - name: Build Python package
        working-directory: interfaces/python
        env:
          CFLAGS: -I${{ github.workspace }}/include
          CXXFLAGS: -I${{ github.workspace }}/include
          LDFLAGS: -L${{ github.workspace}}/build/libs
          QPOASES_PREFIX: ${{ runner.temp }}/qpOASES-install
        run: |
          python -m pip install --upgrade pip build
          python -m build
